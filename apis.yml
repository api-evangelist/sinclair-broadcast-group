apis:
  - name: Sinclair Corporate Content API
    description: >-
      The public, unauthenticated read surface of Sinclair's corporate site at
      sbgi.net. Sinclair runs no developer program and publishes no API
      reference, but the site is WordPress and serves a live REST API at
      /wp-json/ whose index advertises 271 routes across 14 namespaces. Beyond
      the standard wp/v2 content routes, Sinclair ships a first-party sbg/v1
      namespace: station-map returns the company's full television station
      footprint (call letters, network affiliation, DMA name and DMA rank,
      O&O/JSA/SSA ownership status, logo and street address), rsn-map returns
      the regional sports network territories with the teams each carries,
      world-locations powers the interactive Sinclair World experience, and
      latest-posts returns the newsroom feed. Content reads (posts, pages,
      media, categories, search, types, taxonomies, statuses) answer
      anonymously with HTTP 200; users, settings and plugins return HTTP 401.
      This is an undocumented public read surface, not a supported product.
