  - type: Features
    data:
      - name: Local Broadcast Footprint
        description: >-
          Operates roughly 177-185 owned-and-operated and affiliate-managed
          local television stations across ~79-100 U.S. markets, reaching
          roughly 40% of U.S. households with local news, weather, and sports.
      - name: Network Affiliations
        description: >-
          Largest owner of stations affiliated with Fox, NBC, CBS, ABC,
          MyNetworkTV, The CW, and The CW Plus.
      - name: Digital Multicast Networks
        description: >-
          Owns and programs four free over-the-air digital networks: Comet
          (sci-fi), Charge! (action/police), Roar (comedy), and The Nest
          (true crime / lifestyle, launched October 2023 in the slot vacated
          by Stadium).
      - name: Tennis Channel
        description: >-
          24/7 multi-platform tennis cable and streaming network, acquired in
          March 2016 for $350M; ~38M U.S. pay-TV households as of late 2023.
          Includes T2 FAST channel, Pickleball.tv (with the United Pickleball
          Association), and a Tennis Channel direct-to-consumer subscription
          launched November 2024.
      - name: National Desk / Full Measure
        description: >-
          Centrally produced national news (The National Desk) and Sharyl
          Attkisson's investigative program Full Measure distributed across
          the Sinclair station footprint.
      - name: NextGen TV / ATSC 3.0
        description: >-
          Through ONE Media Technologies, Dielectric, CAST.ERA, Bitpath, and
          Broadspan Wireless, Sinclair is a leading commercial driver of
          ATSC 3.0 deployment, dynamic ad insertion, datacasting, and
          broadcast-as-IP (B2X) infrastructure.
      - name: Multi-Platform Advertising
        description: >-
          AMP Sales & Marketing Solutions sells across TV, digital, audio,
          social, and streaming inventory. Vertical units include Drive Auto
          (automotive) and Free State (government).
      - name: Marketing Technology Services
        description: >-
          Compulse (rebranded as Digital Remedy in 2024-2025) offers OTT,
          programmatic, and managed-services martech for SMBs and agencies;
          the Compulse 360 SaaS platform continues under the Digital Remedy
          brand.
      - name: Regional Sports Networks (Legacy)
        description: >-
          Through the spun-off Diamond Sports Group (now Main Street Sports
          Group), Sinclair previously controlled the largest RSN footprint in
          North America under the Fox Sports / Bally Sports / FanDuel Sports
          Network brands.
  - type: Solutions
    data:
      - name: Sinclair Broadcast Group
        description: >-
          Owned-and-operated local television stations and the associated
          local news, weather, and sports programming engine.
      - name: Sinclair Ventures
        description: >-
          Holding entity for non-broadcast operations, including Tennis
          Channel, the digital multicast networks, ad/martech, and broadcast
          technology subsidiaries.
      - name: Tennis Channel
        description: >-
          Cable network, FAST channels (T2, Pickleball.tv), and DTC
          subscription product covering professional tennis, pickleball, and
          racquet-sports lifestyle programming.
      - name: AMP Sales & Marketing Solutions
        description: >-
          Multi-platform local ad sales arm bundling Sinclair's broadcast,
          digital, OTT, social, and audio inventory for advertisers.
      - name: Compulse / Digital Remedy
        description: >-
          Managed services and SaaS martech (Compulse 360, OTT/CTV
          programmatic) for SMB advertisers and agencies.
      - name: ONE Media Technologies
        description: >-
          R&D and commercialization arm for ATSC 3.0 / NextGen TV,
          datacasting, B2X broadcast-as-IP, and dynamic ad insertion.
      - name: Dielectric
        description: >-
          Long-standing manufacturer of broadcast transmitters, antennas, and
          RF systems, supplying U.S. and international broadcasters.
  - type: Integrations
    data:
      - name: Major Broadcast Networks
        description: >-
          Carriage / affiliation agreements with Fox, NBC, CBS, ABC,
          MyNetworkTV, The CW, and The CW Plus.
      - name: Pay-TV Distributors
        description: >-
          Tennis Channel and the regional sports networks are distributed via
          national cable, satellite, and vMVPD operators (Comcast, Charter,
          DirecTV, Dish, YouTube TV, Fubo, etc.).
      - name: FanDuel
        description: >-
          October 2024 naming-rights agreement that rebranded the Bally
          Sports RSNs as the FanDuel Sports Network, with annual rights fees
          and an option for a post-bankruptcy equity stake.
      - name: United Pickleball Association
        description: >-
          Joint Pickleball.tv FAST channel operated with the UPA.
      - name: ATSC 3.0 Industry Partners
        description: >-
          ONE Media works with consumer-electronics OEMs, station groups,
          and standards bodies to commercialize NextGen TV.
  - type: UseCases
    data:
      - name: Local News & Weather Delivery
        description: >-
          Producing and distributing daily local news, severe-weather
          coverage, and community programming across ~80 U.S. markets.
      - name: Live Professional Sports
        description: >-
          National tennis coverage via Tennis Channel and (legacy) local
          MLB / NBA / NHL coverage via the Bally Sports / FanDuel Sports
          Network RSNs and YES Network.
      - name: Local & National Advertising
        description: >-
          Selling broadcast, digital, OTT, and connected-TV ad inventory to
          local SMBs, regional brands, automotive dealers, and political
          campaigns.
      - name: Datacasting and NextGen TV Services
        description: >-
          Using ATSC 3.0 spectrum for targeted advertising, automotive
          telematics, public-safety datacasting, and broadcast-IP
          interoperability.
