name: Sinclair, Inc.
description: >-
  Sinclair, Inc. (Nasdaq: SBGI), formerly Sinclair Broadcast Group, is a
  diversified media company and one of the largest U.S. local television
  broadcasters. The company operates 177-185+ TV stations across roughly 79-86
  markets affiliated with all major broadcast networks (Fox, NBC, CBS, ABC,
  MyNetworkTV, The CW), owns Tennis Channel, holds a stake in YES Network, and
  runs digital multicast networks Comet, Charge!, Roar, and The Nest. Sinclair
  Ventures houses the company's non-broadcast operations, including ad/martech
  units (AMP, Drive Auto, Free State, Digital Remedy/Compulse) and broadcast
  technology subsidiaries (Dielectric, ONE Media Technologies, Bitpath,
  CAST.ERA, Broadspan Wireless). In 2019 Sinclair acquired the Fox Sports
  regional sports networks for ~$9.6 billion through a Diamond Sports Group
  joint venture; Diamond was rebranded Bally Sports in 2021, filed Chapter 11
  in March 2023, exited bankruptcy in January 2025 as Main Street Sports Group,
  rebranded again as FanDuel Sports Network, and is winding down operations
  in mid-2026. Sinclair publishes no public developer APIs.
